services:
  - type: web
    name: ceditrack-server2
    env: node
    rootDir: server
    buildCommand: npm install
    startCommand: node --experimental-sqlite index.js
    envVars:
      - key: NODE_VERSION
        value: 22.12.0
      - key: PORT
        value: 10000
      - key: JWT_SECRET
        generateValue: true
      - key: DB_PATH
        value: ./data/ceditrack.db
